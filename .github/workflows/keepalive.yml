name: Keep database awake

# Supabase pauses free projects after ~7 days without activity.
# This pings the LOTUS ORDERS database every 3 days so it never pauses.
on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ping Supabase
        run: |
          URL="https://ycmwdbejeubukugnrpgw.supabase.co"
          curl -fsS -X POST "$URL/rest/v1/rpc/lotus_ping" \
            -H "apikey: sb_publishable_zb5T2uZUmGgqXP9SclhCLg_rN-d1Fkd" \
            -H "Content-Type: application/json" -d '{}'
          echo " <- database is awake"

      # GitHub turns off scheduled workflows in repos with no activity for 60 days.
      # A tiny empty commit at the start of each month keeps this schedule alive.
      - name: Monthly keep-alive commit
        run: |
          if [ "$(date -u +%d)" -le 03 ] && [ "${{ github.event_name }}" = "schedule" ]; then
            git config user.name "lotus-keepalive"
            git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "keep-alive $(date -u +%Y-%m-%d)"
            git push
          fi
